name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic assessment
        run: python -m src.cli data/synthetic_events.json --output reports/generated-assessment.md
      - name: Verify expected defensive mappings
        run: |
          grep -q 'T1566.002' reports/generated-assessment.md
          grep -q 'T1133' reports/generated-assessment.md
